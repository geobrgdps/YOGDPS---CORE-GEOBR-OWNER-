<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar GDPS — YOGDPS</title><link rel="stylesheet" href="../../assets/css/style.css"><link rel="stylesheet" href="style.css"></head><body><main class="builder"><header class="builder-header"><a class="brand" href="../../index.html"><span class="brand-mark">Y</span><span class="brand-name">YOGDPS</span></a><div class="progress"><span class="active"></span><span></span><span></span></div><a href="../dashboard/index.html" class="close">×</a></header><section class="builder-card"><div class="builder-intro"><span class="eyebrow">GDPS BUILDER</span><h1>Vamos criar seu GDPS.</h1><p>Configure a identidade inicial. O backend do servidor será conectado ao Supabase na próxima etapa.</p></div><form id="builder-form"><div class="field-grid"><label>Nome do GDPS<input id="name" required maxlength="40" placeholder="Meu GDPS"></label><label>Slug<input id="slug" required maxlength="30" pattern="[a-z0-9-]+" placeholder="meu-gdps"></label></div><label>Descrição<textarea id="description" maxlength="180" placeholder="Uma breve descrição do seu servidor..."></textarea></label><div class="field-grid"><label>Versão do Geometry Dash<select id="version"><option>2.2</option><option>2.1</option><option>2.0</option></select></label><label>Visibilidade<select id="visibility"><option value="private">Privado</option><option value="public">Público</option></select></label></div><div class="builder-notice">⚡ <div><strong>Backend preparado</strong><p>Este passo salva uma configuração local. Depois de conectar o Supabase, o mesmo fluxo poderá provisionar e persistir o projeto.</p></div></div><button class="button button-primary" type="submit">Criar projeto →</button></form></section></main><script src="../../assets/js/main.js" defer></script><script src="script.js" defer></script></body></html>
